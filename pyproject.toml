[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "poketask-status"
version = "0.3.0"
description = "A local-first pixel Pokemon desktop companion for coding agents"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0"]

[project.scripts]
poketask = "poketask.app:main"

[tool.setuptools.packages.find]
where = ["src"]
